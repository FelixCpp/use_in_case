name: Publish to pub.dev

# Started by release.yml on the release tag. pub.dev only accepts tokens
# issued for a tag ref, so this workflow must not run on a branch.
on:
  workflow_dispatch:

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Require a tag ref
        run: |
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
            echo "Run this workflow on a release tag (e.g. v2.1.0), not on '$GITHUB_REF'." >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Dart
        uses: dart-lang/setup-dart@v1

      - name: Get dependencies
        run: dart pub get

      - name: Verify tag matches package version
        run: |
          PACKAGE_VERSION="$(sed -n 's/^version: *//p' pubspec.yaml | head -n 1)"
          if [[ "$GITHUB_REF_NAME" != "v$PACKAGE_VERSION" ]]; then
            echo "Tag '$GITHUB_REF_NAME' does not match package version '$PACKAGE_VERSION'." >&2
            exit 1
          fi

      - name: Publish package
        run: dart pub publish --force
